name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test -- --run --passWithNoTests
        continue-on-error: true

      - name: Build Astro
        run: npm run build
        continue-on-error: true

      - name: Build Digital Garden
        run: python3 scripts/build_garden.py
        continue-on-error: true

      - name: Build Teaching pages
        run: python3 scripts/build_teaching.py

      - name: Sync static assets
        # dist/ di-gitignore, jadi `astro build` membuat dist/ dari nol.
        # index.html root + folder statis lain di-track git — script ini
        # menyalinnya balik ke dist/ (lihat scripts/sync_dist_assets.sh).
        run: bash scripts/sync_dist_assets.sh

      - name: Verify required pages exist
        run: |
          fail=0
          for p in dist/index.html dist/mengajar/index.html; do
            if [ ! -f "$p" ]; then echo "❌ MISSING: $p"; fail=1; fi
          done
          for s in $(ls content/teaching | head -50); do
            if [ ! -f "dist/mengajar/$s/index.html" ]; then echo "❌ MISSING teaching page: $s"; fail=1; fi
          done
          if [ "$fail" -ne 0 ]; then echo "Build incomplete — aborting deploy."; exit 1; fi
          echo "✅ Semua halaman wajib tersedia."

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false
          user_name: 'muhdanfyan'
          user_email: 'muhdanfyan@gmail.com'
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
