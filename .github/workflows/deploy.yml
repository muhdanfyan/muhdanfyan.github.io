name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test -- --run --passWithNoTests
        continue-on-error: true

      - name: Build Astro
        run: npm run build

      - name: Build Digital Garden
        run: python3 scripts/build_garden.py

      - name: Sync static assets
        run: |
          # Sinkronkan aset dari public/ dan root agar tidak ada gambar yang hilang
          for dir in img public/img; do
            if [ -d "$dir" ]; then
              mkdir -p dist/$(dirname "$dir" | sed 's|^public/||')
              cp -rn "$dir"/. dist/img/ 2>/dev/null || true
            fi
          done
          # Pastikan folder mengajar & teaching image tersedia
          mkdir -p dist/img/teaching
          cp -rn public/img/teaching/. dist/img/teaching/ 2>/dev/null || true
          touch dist/.nojekyll
          echo "=== dist root ==="
          ls dist/ | head -20

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false
          user_name: 'muhdanfyan'
          user_email: 'muhdanfyan@gmail.com'
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
